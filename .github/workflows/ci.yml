name: CI

# The Android build, the test suites and the security rules all run here.
# That matters beyond the usual reasons: the emulators need a working
# AF_UNIX socket and some Windows machines cannot provide one, so this is
# where the rules tests and the APK can actually be produced.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1
  JAVA_VERSION: '17'

jobs:
  app:
    name: Analyze, test and build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build the Android app
        # The release build is signed with the debug keys for now, per
        # android/app/build.gradle.kts, so it installs on a handset
        # without a keystore in CI. Swap this for a signed build before
        # anything reaches the Play Console.
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: deepfitness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  functions:
    name: Typecheck the Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g firebase-tools
      - run: npm install

      # Runs against the real firestore.rules and storage.rules from the
      # repository root, on a demo project the emulators keep offline.
      - run: npm test
