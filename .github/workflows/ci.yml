name: CI

# The Android build, the test suites and the security rules all run here.
# That matters beyond the usual reasons: the emulators need a working
# AF_UNIX socket and some Windows machines cannot provide one, so this is
# where the rules tests and the APK can actually be produced.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1
  JAVA_VERSION: '17'

jobs:
  app:
    name: Analyze, test and build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so the release build would be signed with the debug key and rejected by the Play Console."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Build the app bundle
        # The bundle is what the Play Console takes. The APK below is only
        # for sideloading onto a handset to try a build by hand.
        run: flutter build appbundle --release

      - name: Build the APK
        run: flutter build apk --release

      - name: Verify the signer
        # build.gradle.kts falls back to the debug key when key.properties is
        # missing, which produces an artifact that looks fine and is refused
        # on upload. Checking the certificate here is what makes that
        # fallback safe to keep.
        run: |
          cert=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$cert" | grep -E "Owner|Valid from" | head -4
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "::error::The app bundle is signed with the DEBUG key and cannot be uploaded."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: deepfitness-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: deepfitness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  functions:
    name: Typecheck the Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools 15 refuses anything below 21. The app build
          # above stays on 17, which is what the Android toolchain wants.
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g firebase-tools
      - run: npm install

      # Runs against the real firestore.rules and storage.rules from the
      # repository root, on a demo project the emulators keep offline.
      - run: npm test
